notification.import.restartHint=Redémarrez l'IDE pour que le chat GitHub Copilot affiche les sessions restaurées : il ne lit sa liste de sessions qu'une seule fois, à l'ouverture du projet.
notification.import.log=Journal d''import : {0}
notification.import.problem.notListed={0} : le dossier restauré ne contient pas de workspace.yaml exploitable, Copilot ne peut donc pas l''afficher. Réexportez la session depuis la machine source, ce chat étant fermé.
notification.import.problem.otherFolder={0} est rattachée à {1}, alors que ce projet est {2} : Copilot ne l''affiche que lorsque ce dossier est ouvert. Réimportez-la avec Replace et l''option «Attach the imported sessions to this folder».
notification.import.problem.noIdeRecord={0} provient d''une archive dépourvue de l''entrée de chat GitHub Copilot : les fichiers sont restaurés mais la conversation n''apparaîtra pas dans le chat. Réexportez-la sur la machine source, depuis le projet auquel appartient la session.
notification.import.problem.ideRecordRefused={0} : le plugin GitHub Copilot a refusé l''entrée de chat ; la conversation est sur le disque mais absente de la liste du chat. Consultez le journal d''import pour en connaître la raison et vérifiez que le plugin GitHub Copilot est installé et activé.
notification.import.problem.noState={0} a été restaurée sans le contenu de sa conversation : réexportez-la sur la machine source, ce chat étant fermé.
notification.import.problem.notIndexed={0} figure dans le chat mais n''a pas été indexée pour la recherche : l''archive ne contenait aucune ligne de base de données la concernant.

export.warning.ideUnavailable=Les entrées de l''historique du chat n''ont pas pu être lues : {0}. L''archive restaure malgré tout les conversations, mais elles ne figureront pas dans l''historique du chat Copilot.
export.warning.noStoreRow={0} : aucune ligne trouvée dans {1}, la session ne serait pas affichée après un import
export.warning.noIdeRecord={0} : le plugin GitHub Copilot n''a aucune trace de cette session dans le projet courant ; après un import, elle n''apparaîtra pas dans l''historique du chat. Exportez-la depuis le projet auquel appartient la conversation.
export.warning.noState={0} : aucun dossier session-state, le contenu de la conversation n''est pas inclus

