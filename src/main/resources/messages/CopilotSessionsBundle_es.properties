notification.import.log=Registro de importación: {0}
notification.import.problem.notListed={0}: la carpeta restaurada no contiene un workspace.yaml utilizable, así que Copilot no puede mostrarla. Vuelve a exportar la sesión desde la máquina de origen con ese chat cerrado.
notification.import.problem.otherFolder={0} está vinculada a {1}, pero este proyecto es {2}: Copilot solo la muestra cuando esa carpeta está abierta. Vuelve a importarla con Replace y la opción «Attach the imported sessions to this folder».
notification.import.problem.noIdeRecord={0} procede de un archivo que no incluye la entrada de chat de GitHub Copilot: los ficheros se restauran, pero la conversación no aparecerá en el chat. Vuelve a exportarla en la máquina de origen, desde el proyecto al que pertenece la sesión.
notification.import.problem.ideRecordRefused={0}: el plugin de GitHub Copilot ha rechazado la entrada de chat, así que la conversación está en disco pero no en la lista del chat. Consulta el registro de importación para saber el motivo y comprueba que el plugin de GitHub Copilot esté instalado y habilitado.
notification.import.problem.noState={0} se ha restaurado sin el contenido de la conversación: vuelve a exportarla en la máquina de origen con ese chat cerrado.
notification.import.problem.notIndexed={0} aparece en el chat pero no se ha indexado para la búsqueda: el archivo no incluía ninguna fila de base de datos para ella.

export.warning.ideUnavailable=No se han podido leer las entradas del historial del chat: {0}. El archivo restaura igualmente las conversaciones, pero no aparecerán en el historial del chat de Copilot.
export.warning.noStoreRow={0}: no se ha encontrado ninguna fila en {1}, la sesión no se mostraría después de una importación
export.warning.noIdeRecord={0}: el plugin de GitHub Copilot no tiene constancia de esta sesión en el proyecto actual, así que después de una importación no aparecerá en el historial del chat. Expórtala desde el proyecto al que pertenece la conversación.
export.warning.noState={0}: no hay carpeta session-state, el contenido de la conversación no se incluye

