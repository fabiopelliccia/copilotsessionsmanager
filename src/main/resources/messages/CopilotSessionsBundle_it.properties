notification.import.problem.notListed={0}: la cartella ripristinata non contiene un workspace.yaml utilizzabile, quindi Copilot non può elencarla. Riesporta la sessione dalla macchina di origine con quella chat chiusa.
notification.import.problem.otherFolder={0} è collegata a {1}, ma questo progetto è {2}: Copilot la elenca solo quando quella cartella è aperta. Importala di nuovo con Replace e l''opzione «Attach the imported sessions to this folder».
notification.import.problem.noIdeRecord={0} proviene da un archivio privo della voce di chat di GitHub Copilot: i file vengono ripristinati ma la conversazione non comparirà nella chat. Riesportala sulla macchina di origine, dal progetto a cui appartiene la sessione.
notification.import.problem.ideRecordRefused={0}: il plugin GitHub Copilot ha rifiutato la voce di chat, quindi la conversazione è su disco ma non nell''elenco della chat. Controlla il log di import per capirne il motivo e verifica che il plugin GitHub Copilot sia installato e abilitato.
notification.import.problem.noState={0} è stata ripristinata senza il contenuto della conversazione: riesportala sulla macchina di origine con quella chat chiusa.
notification.import.problem.notIndexed={0} compare nella chat ma non è stata indicizzata per la ricerca: l''archivio non conteneva nessuna riga di database per lei.

export.warning.ideUnavailable=Non è stato possibile leggere le voci della cronologia chat: {0}. L''archivio ripristina comunque le conversazioni, ma non compariranno nella cronologia della chat Copilot.
export.warning.noStoreRow={0}: nessuna riga trovata in {1}, dopo un import la sessione non verrebbe elencata
export.warning.noIdeRecord={0}: il plugin GitHub Copilot non ha traccia di questa sessione nel progetto corrente, quindi dopo un import non comparirà nella cronologia della chat. Esportala dal progetto a cui appartiene la conversazione.
export.warning.noState={0}: nessuna cartella session-state, il contenuto della conversazione non è incluso

