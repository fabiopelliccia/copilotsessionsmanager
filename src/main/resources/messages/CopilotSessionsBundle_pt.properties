notification.import.problem.notListed={0}: a pasta restaurada não contém um workspace.yaml utilizável, por isso o Copilot não a consegue listar. Volte a exportar a sessão a partir da máquina de origem com esse chat fechado.
notification.import.problem.otherFolder={0} está associada a {1}, mas este projeto é {2}: o Copilot só a lista quando essa pasta está aberta. Importe-a novamente com Replace e a opção «Attach the imported sessions to this folder».
notification.import.problem.noIdeRecord={0} provém de um arquivo sem a entrada de chat do GitHub Copilot: os ficheiros são restaurados, mas a conversa não aparecerá no chat. Volte a exportá-la na máquina de origem, a partir do projeto a que a sessão pertence.
notification.import.problem.ideRecordRefused={0}: o plugin GitHub Copilot recusou a entrada de chat, por isso a conversa está no disco mas não na lista do chat. Consulte o registo de importação para saber o motivo e verifique se o plugin GitHub Copilot está instalado e ativado.
notification.import.problem.noState={0} foi restaurada sem o conteúdo da conversa: volte a exportá-la na máquina de origem com esse chat fechado.
notification.import.problem.notIndexed={0} aparece no chat mas não foi indexada para a pesquisa: o arquivo não continha nenhuma linha de base de dados para ela.

