notification.import.problem.ideRecordRefused={0}: das GitHub Copilot Plugin hat den Chat-Eintrag abgelehnt; die Unterhaltung liegt auf der Festplatte, steht aber nicht in der Chat-Liste. Prüfen Sie den Grund im Importprotokoll und stellen Sie sicher, dass das GitHub Copilot Plugin installiert und aktiviert ist.
notification.import.problem.noState={0} wurde ohne den Inhalt der Unterhaltung wiederhergestellt: exportieren Sie sie auf der Quellmaschine erneut, während dieser Chat geschlossen ist.
notification.import.problem.notIndexed={0} steht im Chat, wurde aber nicht für die Suche indiziert: das Archiv enthielt keine Datenbankzeile dafür.

