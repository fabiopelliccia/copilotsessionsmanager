# --- export notification
notification.export.success.title=Copilot sessions exported
notification.export.warnings.title=Copilot sessions exported with warnings
notification.export.failed.title=Copilot session export failed
notification.export.written={0} session(s) written to {1}
notification.export.unreadableFiles=Close the affected conversations (or restart the IDE) and export again: files that cannot be read are restored incomplete on the other machine.

# --- import notification
notification.import.success.title=Copilot sessions imported
notification.import.warnings.title=Copilot session import completed with warnings
notification.import.failed.title=Copilot session import failed
notification.import.imported={0} imported
notification.import.skipped={0} skipped
notification.import.failures={0} failed
notification.import.session=<b>{0}</b>: {1} ({2} turns)
notification.import.noFolder=no folder
notification.import.restartHint=Restart the IDE to make the GitHub Copilot chat show the restored sessions: the chat reads its session list once, when the project opens.
notification.import.log=Import log: {0}
notification.import.problem.notListed={0}: the restored folder carries no usable workspace.yaml, so Copilot cannot list it. Re-export the session from the source machine while that chat is closed.
notification.import.problem.otherFolder={0} is attached to {1}, but this project is {2}: Copilot lists it only when that folder is open. Import it again with Replace and ''Attach the imported sessions to this folder''.
notification.import.problem.noIdeRecord={0} comes from an archive that does not carry the GitHub Copilot chat entry: the files are restored but the conversation will not appear in the chat. Re-export it on the source machine, from the project the session belongs to.
notification.import.problem.ideRecordRefused={0}: the GitHub Copilot plugin refused the chat entry, so the conversation is on disk but not in the chat list. Check the import log for the reason and make sure the GitHub Copilot plugin is installed and enabled.
notification.import.problem.noState={0} was restored without its conversation content: re-export it on the source machine while that chat is closed.
notification.import.problem.notIndexed={0} is listed in the chat but was not indexed for search: the archive carried no database row for it.

# --- export warnings
export.warning.ideUnavailable=The chat history entries could not be read: {0}. The archive still restores the conversations, but they will not be listed in the Copilot chat history.
export.warning.noStoreRow={0}: no row found in {1}, the session would not be listed after an import
export.warning.noIdeRecord={0}: the GitHub Copilot plugin has no record of this session in the current project, so after an import it will not appear in the chat history. Export it from the project the conversation belongs to.
export.warning.noState={0}: no session-state folder, the conversation content is not included

# --- why the GitHub Copilot plugin bridge is unavailable
ide.unavailable.noProject=no project is open, and the chat history is stored per project
ide.unavailable.pluginMissing=the GitHub Copilot plugin is not installed or is disabled in this IDE
ide.unavailable.apiMissing=the GitHub Copilot plugin persistence API is not available
ide.unavailable.apiFailed=the GitHub Copilot plugin persistence API could not be reached ({0}: {1})

# --- errors
error.storeNotInitialized=The Copilot database {0} is missing or does not contain the expected schema. Start a Copilot chat at least once on this machine before importing sessions.
error.notAnArchive=Not a Copilot session archive: manifest.json is missing
error.unreadableManifest=Unreadable manifest.json
error.archiveTooNew=Archive format {0} is newer than the supported version {1}
